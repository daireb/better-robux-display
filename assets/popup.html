<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Better Robux Display — Settings</title>
    <style>
      :root{
        --bg: #f7f8fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #2563eb;
        --radius: 8px;
        --gap: 12px;
        --maxw: 340px;
      }

      html,body{height:100%;}
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        margin: 0;
        background: var(--bg);
        color: #0f172a;
        -webkit-font-smoothing:antialiased;
        padding: 14px;
        box-sizing: border-box;
        min-width: 260px;
      }

      .card{
        background: var(--card);
        border-radius: var(--radius);
        box-shadow: 0 6px 18px rgba(16,24,40,0.08);
        padding: 12px;
        max-width: var(--maxw);
      }

      .header{
        display:flex;
        gap:10px;
        align-items:center;
        margin-bottom: 8px;
      }

      .header img{width:36px;height:36px;border-radius:6px}
      h1{font-size:14px;margin:0}
      .subtitle{font-size:12px;color:var(--muted)}

      .section{margin-top:var(--gap)}

      .field{display:flex;align-items:center;justify-content:space-between;padding:8px 6px;border-radius:6px}
      .field + .field{margin-top:6px}

      label.row{
        display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:13px
      }

      input[type="checkbox"]{width:18px;height:18px}

      .override{
        display:flex;gap:8px;align-items:center;margin-top:6px
      }
      .override input[type="text"]{
        flex:1;padding:8px;border-radius:6px;border:1px solid #e6eef8;background:#fbfdff;font-size:13px
      }

  /* Buttons removed (settings apply immediately) */
  .buttons{display:none}

      .hint{font-size:12px;color:var(--muted);margin-top:10px}

      @media (max-width:320px){
        .card{padding:10px}
        body{padding:8px}
      }
    </style>
  </head>
  <body>
    <div class="card" role="dialog" aria-label="Better Robux Display settings">
      <div class="header">
        <img src="icons/icon48.png" alt="logo" />
        <div>
          <h1>Better Robux Display</h1>
          <div class="subtitle">Customize how Robux appears on Roblox</div>
        </div>
      </div>

      <div class="section" aria-labelledby="appearance-heading">
        <div id="appearance-heading" style="display:none">Appearance</div>
        <div class="field">
          <label class="row" for="showRobux">
            <input type="checkbox" id="showRobux" />
            <span>Show Robux</span>
          </label>
        </div>

        <div class="field">
          <label class="row" for="showUSD">
            <input type="checkbox" id="showUSD" checked />
            <span>Show USD</span>
          </label>
        </div>
      </div>

      <div class="section" aria-labelledby="override-heading">
        <h2 style="font-size:12px;margin:8px 0 6px">Robux override</h2>
        <div class="override">
          <input type="text" id="robuxOverride" placeholder="Override Robux" aria-label="Robux override" />
          <label class="row" for="enableOverride" style="justify-content:flex-end;gap:6px;min-width:110px">
            <input type="checkbox" id="enableOverride" />
            <span style="font-size:13px">Enable</span>
          </label>
        </div>
      </div>

  <div class="hint" style="margin-top:12px">Changes apply and save immediately.</div>
    </div>

    <script src="../dist/popup.js"></script>
  </body>
</html>
