<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Better Robux Display — Settings</title>
  <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <div class="card" role="dialog" aria-label="Better Robux Display settings">
      <div class="header">
        <div class="icon-wrap"><img src="icons/icon48.png" alt="logo" /></div>
        <div>
          <h1>Better Robux Display</h1>
          <div class="subtitle">Customize how Robux appears on Roblox.com</div>
        </div>
      </div>

      <div class="section" aria-labelledby="appearance-heading">
        <h2 class="section-title" id="appearance-heading">Appearance</h2>
        <div class="field">
          <label class="row" for="showRobux">
            <input type="checkbox" id="showRobux" />
            <span>Show Robux</span>
          </label>
        </div>
        <div class="field">
          <label class="row" for="showUSD">
            <input type="checkbox" id="showUSD" checked />
            <span>Show USD</span>
          </label>
        </div>
      </div>

      <div class="section" aria-labelledby="balance-heading">
        <h2 class="section-title" id="balance-heading">My Balance</h2>
        <div class="radio-group">
          <label class="radio-row" for="balanceShow">
            <input type="radio" name="balanceMode" id="balanceShow" value="show" checked />
            <span>Show</span>
          </label>
          <label class="radio-row" for="balanceHide">
            <input type="radio" name="balanceMode" id="balanceHide" value="hide" />
            <span>Hide</span>
          </label>
          <label class="radio-row" for="balanceOverride">
            <input type="radio" name="balanceMode" id="balanceOverride" value="override" />
            <span>Override</span>
          </label>
          <input type="text" id="robuxOverride" class="override-input" placeholder="1234" aria-label="Robux override value" disabled />
        </div>
      </div>

  <div class="hint" style="margin-top:12px">Changes apply and save immediately.</div>
    </div>

    <script src="../dist/popup.js"></script>
  </body>
</html>
