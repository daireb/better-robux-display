<!DOCTYPE html>
<html>
  <head>
    <title>Plugin Settings</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 10px;
        width: 200px;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h3>Settings</h3>
    <label> <input type="checkbox" id="showRobux" /> Show Robux </label>
    <label> <input type="checkbox" id="showUSD" checked /> Show USD </label>

    <h3>Robux Override</h3>
    <div class="override-container">
      <input type="text" id="robuxOverride" placeholder="Override Robux" />
      <input type="checkbox" id="enableOverride" /> Enable Override
    </div>

    <script src="popup.js"></script>
  </body>
</html>
